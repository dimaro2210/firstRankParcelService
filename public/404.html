<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Firstrank Parcel</title>
    <script>
      // GitHub Pages SPA redirect
      // Redirects all 404s back to the root app so React Router can handle them
      const l = window.location;
      const base = '/firstRankParcelService';
      const path = l.pathname.replace(base, '') || '/';
      const search = l.search ? '?' + l.search.slice(1).replace(/&/g, '~and~') : '';
      const hash = l.hash;
      l.replace(base + '/?p=' + encodeURIComponent(path + search) + hash);
    </script>
  </head>
  <body></body>
</html>
